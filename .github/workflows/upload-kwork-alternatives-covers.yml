name: Upload Kwork alternatives covers to R2
on:
  push:
    paths:
      - 'assets/kwork-alternatives-2026.svg'
      - 'assets/kwork-client-search-2026.svg'
      - '.github/workflows/upload-kwork-alternatives-covers.yml'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://d0abfd352b18b34de7b19d7afdece235.r2.cloudflarestorage.com
      R2_BUCKET: asgroups-images
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Render PNG covers
        run: |
          set -euo pipefail
          rsvg-convert -w 1536 -h 1024 assets/kwork-alternatives-2026.svg -o /tmp/kwork-alternatives-2026.png
          rsvg-convert -w 1536 -h 1024 assets/kwork-client-search-2026.svg -o /tmp/kwork-client-search-2026.png
          file /tmp/kwork-*.png
      - name: Upload and verify
        run: |
          set -euo pipefail
          aws s3 cp /tmp/kwork-alternatives-2026.png s3://${R2_BUCKET}/2026/09/kwork-alternatives-2026.png --endpoint-url "$R2_ENDPOINT" --content-type image/png --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp /tmp/kwork-client-search-2026.png s3://${R2_BUCKET}/2026/09/kwork-client-search-2026.png --endpoint-url "$R2_ENDPOINT" --content-type image/png --cache-control 'public,max-age=31536000,immutable'
          curl -fsS -o /tmp/r2-a.png https://img.likelyin.ru/2026/09/kwork-alternatives-2026.png
          curl -fsS -o /tmp/r2-b.png https://img.likelyin.ru/2026/09/kwork-client-search-2026.png
          cmp /tmp/kwork-alternatives-2026.png /tmp/r2-a.png
          cmp /tmp/kwork-client-search-2026.png /tmp/r2-b.png
          sha256sum /tmp/kwork-alternatives-2026.png /tmp/kwork-client-search-2026.png
