name: Upload WordPress Apps Script cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-wordpress-apps-script-cover.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OBJECT_KEY: 2026/09/wordpress-rest-api-google-apps-script-avtomatizaciya.webp
      PUBLIC_URL: https://img.likelyin.ru/2026/09/wordpress-rest-api-google-apps-script-avtomatizaciya.webp?v=20260901-0835
    steps:
      - name: Build realistic cover
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          curl --fail --location --silent --show-error \
            'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1800&q=85' \
            --output source.jpg
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          src = Image.open('source.jpg').convert('RGB')
          target = (1536, 1024)
          sw, sh = src.size
          scale = max(target[0]/sw, target[1]/sh)
          nw, nh = int(sw*scale), int(sh*scale)
          src = src.resize((nw, nh), Image.Resampling.LANCZOS)
          left = (nw-target[0])//2
          top = (nh-target[1])//2
          im = src.crop((left, top, left+target[0], top+target[1])).convert('RGBA')

          # Dark translucent panel on the left; keep the laptop/workspace visible.
          panel = Image.new('RGBA', target, (0,0,0,0))
          pd = ImageDraw.Draw(panel)
          for x in range(0, 820):
              alpha = int(205 * (1 - x/980))
              alpha = max(35, alpha)
              pd.rectangle((x,0,x+1,target[1]), fill=(7,12,18,alpha))
          im = Image.alpha_composite(im, panel)
          draw = ImageDraw.Draw(im)

          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          f1 = ImageFont.truetype(bold, 92)
          f2 = ImageFont.truetype(bold, 74)
          f3 = ImageFont.truetype(regular, 42)
          f4 = ImageFont.truetype(bold, 34)

          x, y = 78, 220
          draw.text((x,y), 'WordPress', font=f1, fill='white')
          y += 115
          draw.text((x,y), '+ Google Apps Script', font=f2, fill='white')
          y += 118
          draw.rounded_rectangle((x,y,x+570,y+72), radius=22, fill=(24,145,110,225))
          draw.text((x+28,y+13), 'автоматизация через REST API', font=f4, fill='white')
          y += 126
          draw.text((x,y), 'Без ручной рутины и лишних плагинов', font=f3, fill=(235,242,246,255))

          out = im.convert('RGB')
          out.save('cover.webp', 'WEBP', quality=82, method=6)
          print('dimensions=', out.size)
          print('size=', Path('cover.webp').stat().st_size)
          PY
          test "$(file -b --mime-type cover.webp)" = 'image/webp'
          test "$(wc -c < cover.webp)" -gt 0
          test "$(wc -c < cover.webp)" -le 256000
          sha256sum cover.webp | tee source.sha256

      - name: Upload binary to R2 and verify
        shell: bash
        env:
          R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$R2_UPLOAD_API_TOKEN"
          upload_code=$(curl --silent --show-error \
            --output upload-response.txt \
            --write-out '%{http_code}' \
            --request PUT \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}" \
            --header "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            --header 'Content-Type: image/webp' \
            --data-binary '@cover.webp')
          if [[ "$upload_code" != '200' && "$upload_code" != '201' && "$upload_code" != '204' ]]; then
            echo "R2 upload failed: HTTP $upload_code" >&2
            cat upload-response.txt >&2 || true
            exit 1
          fi
          curl --fail --location --silent --show-error "$PUBLIC_URL" --output verify.webp
          test "$(file -b --mime-type verify.webp)" = 'image/webp'
          src_sha=$(sha256sum cover.webp | awk '{print $1}')
          r2_sha=$(sha256sum verify.webp | awk '{print $1}')
          test "$src_sha" = "$r2_sha"
          echo "R2_IMAGE_URL=$PUBLIC_URL"
          echo "R2_SHA256=$r2_sha"
          echo "R2_SIZE=$(wc -c < verify.webp | tr -d ' ')"
