name: Verify Kwork WordPress cover

on:
  push:
    paths:
      - '.github/workflows/verify-kwork-wordpress-cover.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: '49f36b536663dbff1171174e55cf8e25bac51dc51992a482517903813e5d4243'
      R2_URL: 'https://img.likelyin.ru/2026/08/kwork-ogranicheniya-cover.png'
      ARTICLE_URL: 'https://asgroups.dev/shest-let-na-kwork-pochemu-zakryvayut-prodazhi-iz-za-grazhdanstva/'
    steps:
      - name: Verify WordPress featured media for post 709
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://asgroups.dev/wp-json/wp/v2/posts/709?_embed=1' -o /tmp/post.json
          media_url="$(jq -r '._embedded["wp:featuredmedia"][0].source_url // empty' /tmp/post.json)"
          test -n "$media_url"
          width="$(jq -r '._embedded["wp:featuredmedia"][0].media_details.width // 0' /tmp/post.json)"
          height="$(jq -r '._embedded["wp:featuredmedia"][0].media_details.height // 0' /tmp/post.json)"
          test "$width" -eq 1672
          test "$height" -eq 941
          case "$media_url" in *.png) ;; *) echo "Featured media is not PNG: $media_url" >&2; exit 1;; esac
          echo "WP_MEDIA_URL=$media_url"
          curl --fail --silent --show-error "$media_url?verify=${GITHUB_SHA}" -o /tmp/wp-cover.png
          echo "$EXPECTED_SHA256  /tmp/wp-cover.png" | sha256sum -c -

      - name: Verify article HTML uses the new cover
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$ARTICLE_URL?verify=${GITHUB_SHA}" -o /tmp/article.html
          grep -q 'kwork-ogranicheniya-cover' /tmp/article.html
          echo 'ARTICLE_COVER_VERIFIED=true'
