name: A.S Groups — Exact image to R2

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Source transport: drive, source_url or generate"
        required: true
        default: "drive"
        type: choice
        options: [drive, source_url, generate]
      drive_file_id:
        description: "Google Drive file ID for drive mode"
        required: false
        default: ""
        type: string
      source_url:
        description: "Temporary HTTPS exact-byte URL; manual dispatch only"
        required: false
        default: ""
        type: string
      generate_prompt:
        description: "Prompt for one cohesive generated cover"
        required: false
        default: ""
        type: string
      generate_seed:
        description: "Optional numeric seed"
        required: false
        default: ""
        type: string
      r2_key:
        description: "Destination R2 key"
        required: true
        type: string
      content_type:
        description: "Expected final MIME"
        required: true
        default: "image/webp"
        type: string
      expected_sha256:
        description: "Expected SHA-256"
        required: false
        default: ""
        type: string
      expected_size:
        description: "Expected byte size"
        required: false
        default: ""
        type: string
      min_bytes:
        description: "Minimum bytes"
        required: false
        default: "10000"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/asgroups-r2-jobs/*.json'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      R2_UPLOAD_BASE: https://upload.likelyin.ru/v1/upload
      R2_PUBLIC_BASE: https://img.likelyin.ru

    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve inputs
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_MODE: ${{ inputs.source_mode }}
          MANUAL_DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
          MANUAL_GENERATE_PROMPT: ${{ inputs.generate_prompt }}
          MANUAL_GENERATE_SEED: ${{ inputs.generate_seed }}
          MANUAL_R2_KEY: ${{ inputs.r2_key }}
          MANUAL_CONTENT_TYPE: ${{ inputs.content_type }}
          MANUAL_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          MANUAL_EXPECTED_SIZE: ${{ inputs.expected_size }}
          MANUAL_MIN_BYTES: ${{ inputs.min_bytes }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            source_mode="${MANUAL_SOURCE_MODE:-drive}"
            drive_file_id="${MANUAL_DRIVE_FILE_ID:-}"
            source_url="${MANUAL_SOURCE_URL:-}"
            generate_prompt="${MANUAL_GENERATE_PROMPT:-}"
            generate_seed="${MANUAL_GENERATE_SEED:-}"
            r2_key="$MANUAL_R2_KEY"
            content_type="${MANUAL_CONTENT_TYPE:-image/webp}"
            expected_sha256="${MANUAL_EXPECTED_SHA256:-}"
            expected_size="${MANUAL_EXPECTED_SIZE:-}"
            min_bytes="${MANUAL_MIN_BYTES:-10000}"
          else
            mapfile -t jobs < <(git diff --diff-filter=AM --name-only HEAD^ HEAD -- '.github/asgroups-r2-jobs/*.json' | sort -u)
            (( ${#jobs[@]} == 1 )) || { echo "Expected exactly one added/modified job JSON" >&2; exit 1; }
            job="${jobs[0]}"
            jq -e 'type=="object" and (.r2_key|type=="string" and length>0) and ((.source_mode//"drive")|IN("drive","source_url","generate"))' "$job" >/dev/null
            source_mode="$(jq -r '.source_mode // "drive"' "$job")"
            drive_file_id="$(jq -r '.drive_file_id // ""' "$job")"
            source_url="$(jq -r '.source_url // ""' "$job")"
            generate_prompt="$(jq -r '.generate_prompt // ""' "$job")"
            generate_seed="$(jq -r '(.generate_seed // "")|tostring' "$job")"
            r2_key="$(jq -r '.r2_key' "$job")"
            content_type="$(jq -r '.content_type // "image/webp"' "$job")"
            expected_sha256="$(jq -r '.expected_sha256 // ""' "$job")"
            expected_size="$(jq -r '(.expected_size // "")|tostring' "$job")"
            min_bytes="$(jq -r '(.min_bytes // 10000)|tostring' "$job")"
            [[ -z "$source_url" ]] || { echo "source_url forbidden in push job JSON" >&2; exit 1; }
          fi
          {
            echo "source_mode=$source_mode"
            echo "drive_file_id=$drive_file_id"
            echo "source_url=$source_url"
            echo "generate_seed=$generate_seed"
            echo "r2_key=$r2_key"
            echo "content_type=$content_type"
            echo "expected_sha256=$expected_sha256"
            echo "expected_size=$expected_size"
            echo "min_bytes=$min_bytes"
            echo 'generate_prompt<<ASGEOF'
            printf '%s\n' "$generate_prompt"
            echo ASGEOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_MODE: ${{ steps.resolve.outputs.source_mode }}
          DRIVE_FILE_ID: ${{ steps.resolve.outputs.drive_file_id }}
          SOURCE_URL: ${{ steps.resolve.outputs.source_url }}
          GENERATE_PROMPT: ${{ steps.resolve.outputs.generate_prompt }}
          GENERATE_SEED: ${{ steps.resolve.outputs.generate_seed }}
          R2_KEY: ${{ steps.resolve.outputs.r2_key }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          EXPECTED_SHA256: ${{ steps.resolve.outputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ steps.resolve.outputs.expected_size }}
          MIN_BYTES: ${{ steps.resolve.outputs.min_bytes }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_MODE" =~ ^(drive|source_url|generate)$ ]]
          [[ "$R2_KEY" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$R2_KEY" != /* ]] && [[ "$R2_KEY" != *".."* ]]
          [[ "$CONTENT_TYPE" =~ ^image/(png|jpeg|webp|avif|gif)$ ]]
          [[ "$MIN_BYTES" =~ ^[0-9]+$ ]]
          [[ -z "$EXPECTED_SHA256" || "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ -z "$EXPECTED_SIZE" || "$EXPECTED_SIZE" =~ ^[0-9]+$ ]]
          case "$SOURCE_MODE" in
            drive)
              test -n "$R2_UPLOAD_API_TOKEN"
              [[ "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]]
              test -z "$SOURCE_URL"; test -z "$GENERATE_PROMPT"
              ;;
            source_url)
              test -n "$R2_UPLOAD_API_TOKEN"
              test "$EVENT_NAME" = workflow_dispatch
              [[ "$SOURCE_URL" == https://* ]]
              test -z "$DRIVE_FILE_ID"; test -z "$GENERATE_PROMPT"
              ;;
            generate)
              test -z "$DRIVE_FILE_ID"; test -z "$SOURCE_URL"; test -n "$GENERATE_PROMPT"
              test "$CONTENT_TYPE" = image/webp
              [[ -z "$GENERATE_SEED" || "$GENERATE_SEED" =~ ^[0-9]+$ ]]
              ;;
          esac

      - name: Prepare exact source bytes
        id: source
        shell: bash
        env:
          SOURCE_MODE: ${{ steps.resolve.outputs.source_mode }}
          DRIVE_FILE_ID: ${{ steps.resolve.outputs.drive_file_id }}
          SOURCE_URL: ${{ steps.resolve.outputs.source_url }}
          GENERATE_PROMPT: ${{ steps.resolve.outputs.generate_prompt }}
          GENERATE_SEED: ${{ steps.resolve.outputs.generate_seed }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          EXPECTED_SHA256: ${{ steps.resolve.outputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ steps.resolve.outputs.expected_size }}
          MIN_BYTES: ${{ steps.resolve.outputs.min_bytes }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/source-image"
          rm -f "$src"

          if [[ "$SOURCE_MODE" == generate ]]; then
            raw="$RUNNER_TEMP/generated-raw"
            seed="${GENERATE_SEED:-$RANDOM}"
            encoded="$(python3 - "$GENERATE_PROMPT" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
            url="https://image.pollinations.ai/prompt/${encoded}?width=1536&height=1024&model=flux&seed=${seed}&nologo=true&safe=true"
            curl --fail-with-body --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 240 --silent --show-error "$url" -o "$raw"
            test -s "$raw"
            [[ "$(file -b --mime-type "$raw")" == image/* ]]
            python3 -m pip install --disable-pip-version-check --quiet pillow
            python3 - "$raw" "$src" <<'PY'
          import sys
          from PIL import Image, ImageOps
          raw, out = sys.argv[1:3]
          with Image.open(raw) as im:
              im = ImageOps.fit(im.convert('RGB'), (1536, 1024), method=Image.Resampling.LANCZOS)
              im.save(out, 'WEBP', quality=84, method=6)
          PY
          elif [[ "$SOURCE_MODE" == source_url ]]; then
            echo "::add-mask::$SOURCE_URL"
            curl --fail-with-body --location --retry 2 --retry-all-errors --silent --show-error "$SOURCE_URL" -o "$src"
          else
            curl -fL --retry 2 --retry-all-errors -o "$src" "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" || true
            mime="$(file -b --mime-type "$src" 2>/dev/null || true)"
            if [[ "$mime" != image/* && -n "${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
              rm -f "$src"
              cred="$RUNNER_TEMP/gdrive.json"; umask 077; printf '%s' "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" > "$cred"
              python3 -m pip install --disable-pip-version-check --quiet google-auth
              python3 - "$DRIVE_FILE_ID" "$src" "$cred" <<'PY'
          import sys
          from urllib.parse import quote
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          fid,dst,cp=sys.argv[1:4]
          creds=service_account.Credentials.from_service_account_file(cp,scopes=['https://www.googleapis.com/auth/drive.readonly'])
          r=AuthorizedSession(creds).get(f'https://www.googleapis.com/drive/v3/files/{quote(fid,safe="")}',params={'alt':'media','supportsAllDrives':'true'},stream=True,timeout=60)
          r.raise_for_status()
          with open(dst,'wb') as f:
              for c in r.iter_content(1024*1024):
                  if c: f.write(c)
          PY
              rm -f "$cred"
            fi
            mime="$(file -b --mime-type "$src" 2>/dev/null || true)"
            if [[ "$mime" != image/* ]]; then
              rm -f "$src"
              python3 -m pip install --disable-pip-version-check --quiet gdown
              python3 -m gdown "$DRIVE_FILE_ID" -O "$src"
            fi
          fi

          test -s "$src"
          size="$(wc -c < "$src" | tr -d ' ')"
          mime="$(file -b --mime-type "$src")"
          sha="$(sha256sum "$src" | awk '{print $1}')"
          test "$mime" = "$CONTENT_TYPE"
          (( size >= MIN_BYTES ))
          if [[ -n "$EXPECTED_SIZE" ]]; then test "$size" -eq "$EXPECTED_SIZE"; fi
          if [[ -n "$EXPECTED_SHA256" ]]; then test "${sha,,}" = "${EXPECTED_SHA256,,}"; fi
          echo "SOURCE size=$size mime=$mime sha256=$sha"
          {
            echo "sha256=$sha"
            echo "size=$size"
            echo "mime=$mime"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve generated exact WebP
        if: steps.resolve.outputs.source_mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: generated-cover
          path: ${{ runner.temp }}/source-image
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Binary PUT exact bytes to R2
        if: steps.resolve.outputs.source_mode != 'generate'
        shell: bash
        env:
          R2_KEY: ${{ steps.resolve.outputs.r2_key }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/source-image"
          public_url="${R2_PUBLIC_BASE}/${R2_KEY}"
          response="$(curl --fail-with-body --silent --show-error -X PUT "${R2_UPLOAD_BASE}/${R2_KEY}" -H "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" -H "Content-Type: ${CONTENT_TYPE}" -H 'X-ASG-Overwrite: true' --data-binary "@${src}")"
          size="$(wc -c < "$src" | tr -d ' ')"
          echo "$response" | jq -e --arg url "$public_url" --argjson size "$size" '.ok==true and .url==$url and .size==$size' >/dev/null
          echo "Uploaded exact bytes to $public_url"

      - name: Verify R2 byte-for-byte
        if: steps.resolve.outputs.source_mode != 'generate'
        shell: bash
        env:
          R2_KEY: ${{ steps.resolve.outputs.r2_key }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/source-image"; dst="$RUNNER_TEMP/r2-image"; public_url="${R2_PUBLIC_BASE}/${R2_KEY}"
          curl -fsSL --retry 2 -o "$dst" "${public_url}?verify=${GITHUB_RUN_ID}"
          cmp "$src" "$dst"
          src_sha="$(sha256sum "$src"|awk '{print $1}')"; dst_sha="$(sha256sum "$dst"|awk '{print $1}')"
          src_size="$(wc -c < "$src"|tr -d ' ')"; dst_size="$(wc -c < "$dst"|tr -d ' ')"
          test "$src_sha" = "$dst_sha"; test "$src_size" -eq "$dst_size"
          echo "R2_OK url=$public_url size=$dst_size sha256=$dst_sha"

      - name: Summary
        shell: bash
        env:
          SOURCE_MODE: ${{ steps.resolve.outputs.source_mode }}
          R2_KEY: ${{ steps.resolve.outputs.r2_key }}
          SOURCE_SHA: ${{ steps.source.outputs.sha256 }}
          SOURCE_SIZE: ${{ steps.source.outputs.size }}
        run: |
          set -euo pipefail
          {
            echo '### A.S Groups media stage'
            echo
            echo "- Source mode: $SOURCE_MODE"
            echo "- Bytes: $SOURCE_SIZE"
            echo "- SHA-256: $SOURCE_SHA"
            if [[ "$SOURCE_MODE" == generate ]]; then
              echo '- Generated exact WebP preserved as workflow artifact for Google Drive staging.'
            else
              echo "- URL: ${R2_PUBLIC_BASE}/${R2_KEY}"
              echo '- Verification: byte-for-byte OK'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
