name: Upload realistic Albato cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-realistic-albato-cover.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
      OBJECT_KEY: 2026/08/albato-posiflora-vk-sinhronizaciya-tovarov.webp
      PUBLIC_URL: https://img.likelyin.ru/2026/08/albato-posiflora-vk-sinhronizaciya-tovarov.webp?v=20260831-realistic
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Reconstruct, validate and upload exact generated cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, glob, hashlib
          from PIL import Image
          parts=sorted(glob.glob('tmp-generated-cover-b85/part*.txt'))
          assert len(parts) == 7, parts
          s=''.join(open(p,encoding='utf-8').read() for p in parts)
          data=base64.b85decode(s.encode())
          open('/tmp/cover.webp','wb').write(data)
          sha=hashlib.sha256(data).hexdigest()
          assert sha == '896c5a6765d36cfd1b7682e02f74da34193d32e98e5817f39f9b620e9daa2ba9', sha
          im=Image.open('/tmp/cover.webp')
          assert im.size == (1536,1024), im.size
          assert im.format == 'WEBP', im.format
          print('READY', len(data), im.size, sha)
          PY
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            --header 'Content-Type: image/webp' \
            --header 'X-ASG-Overwrite: true' \
            --data-binary '@/tmp/cover.webp' \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}"
          sleep 3
          curl -fsSL "${PUBLIC_URL}" -o /tmp/public.webp
          echo "source=$(sha256sum /tmp/cover.webp | awk '{print $1}')"
          echo "public=$(sha256sum /tmp/public.webp | awk '{print $1}')"
          test "$(sha256sum /tmp/cover.webp | awk '{print $1}')" = "$(sha256sum /tmp/public.webp | awk '{print $1}')"
