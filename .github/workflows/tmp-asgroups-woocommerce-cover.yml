name: Temporary A.S Groups WooCommerce cover

on:
  push:
    paths:
      - ".github/workflows/tmp-asgroups-woocommerce-cover.yml"

permissions:
  contents: read

jobs:
  upload-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OBJECT_KEY: 2026/09/woocommerce-rest-api-crm-avtomatizaciya.webp
      SOURCE_URL: https://pd.w.org/2025/02/41667ab2010c76734.40396731-scaled.jpg
      PUBLIC_URL: https://img.likelyin.ru/2026/09/woocommerce-rest-api-crm-avtomatizaciya.webp
      R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
    steps:
      - name: Build final WebP cover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_UPLOAD_API_TOKEN"
          curl --fail --location --silent --show-error "$SOURCE_URL" -o source.jpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          for q in 80 74 68 62 56; do
            convert source.jpg -auto-orient -resize '1536x1024^' -gravity center -extent 1536x1024 \
              -fill 'rgba(0,0,0,0.58)' -draw 'roundrectangle 70,785 1110,955 24,24' \
              -font DejaVu-Sans-Bold -pointsize 78 -fill white -gravity southwest -annotate +105+145 'WooCommerce REST API' \
              -font DejaVu-Sans -pointsize 38 -fill white -gravity southwest -annotate +108+88 'Интеграция с CRM и автоматизацией' \
              -strip -quality "$q" cover.webp
            size=$(wc -c < cover.webp)
            if [ "$size" -le 250000 ]; then break; fi
          done
          dims=$(identify -format '%wx%h' cover.webp)
          mime=$(file -b --mime-type cover.webp)
          size=$(wc -c < cover.webp)
          sha=$(sha256sum cover.webp | awk '{print $1}')
          test "$dims" = '1536x1024'
          test "$mime" = 'image/webp'
          test "$size" -gt 0
          echo "DIMENSIONS=$dims"
          echo "MIME=$mime"
          echo "SIZE=$size"
          echo "SHA256=$sha"

      - name: Binary PUT and R2 verification
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/upload-response.txt" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $R2_UPLOAD_API_TOKEN" \
            --header 'Content-Type: image/webp' \
            --data-binary @cover.webp \
            "https://upload.likelyin.ru/v1/upload/$OBJECT_KEY")
          if [[ "$code" != "200" && "$code" != "201" ]]; then
            echo "R2 upload failed: HTTP $code" >&2
            cat "$RUNNER_TEMP/upload-response.txt" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error "$PUBLIC_URL?v=${GITHUB_RUN_ID}" -o r2.webp
          src_sha=$(sha256sum cover.webp | awk '{print $1}')
          r2_sha=$(sha256sum r2.webp | awk '{print $1}')
          r2_mime=$(file -b --mime-type r2.webp)
          r2_dims=$(identify -format '%wx%h' r2.webp)
          r2_size=$(wc -c < r2.webp)
          test "$src_sha" = "$r2_sha"
          test "$r2_mime" = 'image/webp'
          test "$r2_dims" = '1536x1024'
          echo "R2_HTTP=200"
          echo "R2_MIME=$r2_mime"
          echo "R2_DIMENSIONS=$r2_dims"
          echo "R2_SIZE=$r2_size"
          echo "R2_SHA256=$r2_sha"
          echo "R2_URL=$PUBLIC_URL"
