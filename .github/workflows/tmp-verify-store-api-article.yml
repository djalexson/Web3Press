name: Temp verify Store API article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-store-api-article.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live HTML, media and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4 pillow requests
          python3 - <<'PY'
          import hashlib, io, json, re, sys
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          page='https://asgroups.dev/woocommerce-store-api-vs-rest-api/'
          expected_title='WooCommerce Store API vs REST API: что выбрать для интеграции магазина'
          expected_sha='3d83c5e58ca237e1eefcfb2fe3e732fca58c96e8f8d8406c5c8f10cffecd23f5'
          r2='https://img.likelyin.ru/2026/09/woocommerce-store-api-vs-rest-api.webp'
          wp_media='https://asgroups.dev/wp-content/uploads/2026/09/woocommerce-store-api-vs-rest-api.webp'
          s=requests.Session(); s.headers['User-Agent']='ASGroupsVerifier/1.0'

          r=s.get(page, timeout=30); print('LIVE', r.status_code, r.url, r.headers.get('content-type'), len(r.content)); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          h1=soup.find('h1'); assert h1 and expected_title in h1.get_text(' ',strip=True), h1
          canonical=soup.find('link', rel='canonical'); assert canonical and canonical.get('href','').rstrip('/') == page.rstrip('/'), canonical
          assert soup.select_one('section.article-flow')
          assert soup.select_one('section.article-checklist')
          faq=soup.select_one('section.article-faq'); assert faq
          faq_h3=faq.find_all('h3'); assert len(faq_h3)==6, len(faq_h3)
          text=r.text
          assert 'BlogPosting' in text
          assert 'FAQPage' in text
          assert 'Официальные источники' in text
          print('HTML_OK h1=1 canonical=', canonical.get('href'), 'faq=', len(faq_h3), 'BlogPosting=1 FAQPage=1')

          for u in [
            'https://asgroups.dev/woocommerce-razrabotka/',
            'https://asgroups.dev/crm-integracii-s-sajtom/',
            'https://asgroups.dev/razrabotka-plaginov-wordpress/'
          ]:
            rr=s.get(u, timeout=20); print('INTERNAL', rr.status_code, u); assert rr.status_code==200

          rest=s.get('https://asgroups.dev/wp-json/wp/v2/posts/816?_embed=1', timeout=30); print('WP_REST', rest.status_code); rest.raise_for_status(); data=rest.json()
          assert data.get('status')=='publish'
          assert data.get('slug')=='woocommerce-store-api-vs-rest-api'
          fm=((data.get('_embedded') or {}).get('wp:featuredmedia') or [{}])[0].get('source_url','')
          print('WP_FEATURED', fm); assert fm==wp_media

          blobs=[]
          for label,u in [('R2',r2),('WP',wp_media)]:
            rr=s.get(u,timeout=30); rr.raise_for_status(); b=rr.content; sha=hashlib.sha256(b).hexdigest(); im=Image.open(io.BytesIO(b)); im.load()
            print(label, rr.status_code, rr.headers.get('content-type'), len(b), im.format, im.size, sha)
            assert rr.headers.get('content-type','').split(';')[0]=='image/webp'
            assert im.size==(1536,1024)
            assert len(b)==120628
            assert sha==expected_sha
            blobs.append(b)
          assert blobs[0]==blobs[1]
          print('MEDIA_BYTE_FOR_BYTE_OK')

          slug='woocommerce-store-api-vs-rest-api'
          candidates=['https://asgroups.dev/wp-sitemap.xml','https://asgroups.dev/sitemap_index.xml','https://asgroups.dev/post-sitemap.xml','https://asgroups.dev/wp-sitemap-posts-post-1.xml']
          found=False; checked=set(); queue=list(candidates)
          while queue and len(checked)<30:
            u=queue.pop(0)
            if u in checked: continue
            checked.add(u)
            try:
              rr=s.get(u,timeout=15)
            except Exception: continue
            if rr.status_code!=200: continue
            if slug in rr.text:
              print('SITEMAP_FOUND', u); found=True; break
            if '<sitemapindex' in rr.text:
              for loc in re.findall(r'<loc>(.*?)</loc>', rr.text):
                if loc.startswith('https://asgroups.dev/') and loc not in checked: queue.append(loc)
          assert found, 'slug not found in checked sitemaps: '+repr(sorted(checked))
          print('SITEMAP_OK')
          PY

      - name: Verify desktop and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet selenium
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME=$chrome"
          python3 - <<'PY'
          import json, os, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url='https://asgroups.dev/woocommerce-store-api-vs-rest-api/'
          for label,w,h in [('desktop',1440,1100),('mobile',390,844)]:
            o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument(f'--window-size={w},{h}')
            d=webdriver.Chrome(options=o)
            d.set_window_size(w,h); d.get(url); time.sleep(2)
            metrics=d.execute_script('''
              const de=document.documentElement;
              const flow=document.querySelector('.article-flow');
              const checklist=document.querySelector('.article-checklist');
              const faq=document.querySelector('.article-faq');
              const firstLi=document.querySelector('.article-checklist li');
              const before=firstLi?getComputedStyle(firstLi,'::before'):null;
              const btn=faq?faq.querySelector('button'):null;
              return {
                innerWidth: window.innerWidth,
                scrollWidth: de.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                flowVisible: !!(flow && flow.getBoundingClientRect().width>0 && flow.getBoundingClientRect().height>0),
                checklistVisible: !!(checklist && checklist.getBoundingClientRect().width>0 && checklist.getBoundingClientRect().height>0),
                faqVisible: !!(faq && faq.getBoundingClientRect().width>0 && faq.getBoundingClientRect().height>0),
                checklistBeforeContent: before?before.content:null,
                checklistBeforeColor: before?before.color:null,
                faqButton: !!btn,
                faqExpanded: btn?btn.getAttribute('aria-expanded'):null,
                tables: [...document.querySelectorAll('table')].map(x=>({client:x.clientWidth,scroll:x.scrollWidth})),
                pres: [...document.querySelectorAll('pre')].map(x=>({client:x.clientWidth,scroll:x.scrollWidth}))
              };
            ''')
            assert metrics['scrollWidth'] <= metrics['innerWidth'] + 2, metrics
            assert metrics['flowVisible'] and metrics['checklistVisible'] and metrics['faqVisible'], metrics
            if metrics['faqButton']:
              d.execute_script("document.querySelector('.article-faq button').click()")
              time.sleep(.3)
              after=d.execute_script("return document.querySelector('.article-faq button').getAttribute('aria-expanded')")
              print(label,'FAQ_TOGGLE',metrics['faqExpanded'],'->',after)
              assert after != metrics['faqExpanded']
            else:
              raise AssertionError('FAQ accordion button not found')
            path=f'/tmp/{label}.png'; d.save_screenshot(path)
            print(label.upper(),json.dumps(metrics,ensure_ascii=False))
            d.quit()
          PY

      - name: Upload verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-api-live-verification
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
          retention-days: 2
