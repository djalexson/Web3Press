name: Upload REST API application passwords cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-rest-api-application-passwords-cover.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload cover
        env:
          R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
          OBJECT_KEY: 2026/08/wordpress-rest-api-application-passwords-2026.webp
          PUBLIC_URL: https://img.likelyin.ru/2026/08/wordpress-rest-api-application-passwords-2026.webp
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import hashlib
          W,H=1536,1024
          img=Image.new('RGB',(W,H),(9,18,42))
          p=img.load()
          for y in range(H):
              for x in range(W):
                  t=x/W; u=y/H
                  p[x,y]=(int(10+25*t),int(20+20*t),int(45+55*t+10*(1-u)))
          d=ImageDraw.Draw(img)
          for box,fill in [((1020,-120,1600,460),(47,43,116)),((40,580,640,1120),(20,34,80)),((520,380,1280,1160),(31,35,104))]:
              d.ellipse(box,fill=fill)
          fb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          fr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          fm='/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'
          brand=ImageFont.truetype(fb,26); title=ImageFont.truetype(fb,56); title2=ImageFont.truetype(fb,46)
          sub=ImageFont.truetype(fr,27); small=ImageFont.truetype(fr,22); code=ImageFont.truetype(fm,22)
          d.rounded_rectangle((72,68,318,124),radius=22,fill=(248,249,252)); d.text((99,82),'A.S GROUPS',font=brand,fill=(31,40,75))
          d.text((72,190),'WordPress REST API',font=title,fill='white')
          d.text((72,278),'без основного пароля',font=title2,fill=(180,178,255))
          d.text((74,365),'Application Passwords для безопасных',font=sub,fill=(224,229,243))
          d.text((74,405),'интеграций и автоматизации',font=sub,fill=(224,229,243))
          pts=[('01','Отдельный пароль для каждой интеграции'),('02','HTTPS + Basic Auth'),('03','Отзыв без смены основного пароля')]
          yy=525
          for n,txt in pts:
              d.rounded_rectangle((74,yy,128,yy+52),radius=14,fill=(98,81,245)); d.text((87,yy+10),n,font=brand,fill='white'); d.text((154,yy+10),txt,font=small,fill=(238,241,250)); yy+=84
          d.rounded_rectangle((825,145,1465,862),radius=34,fill=(15,23,44),outline=(112,95,255),width=3)
          d.rounded_rectangle((865,188,1425,248),radius=18,fill=(31,39,74))
          for i,c in enumerate([(255,93,104),(255,193,85),(74,211,137)]):
              xx=891+i*29; d.ellipse((xx,210,xx+16,226),fill=c)
          d.text((985,199),'REST API request',font=brand,fill=(239,241,248))
          lines=[('curl --user "api-user:••••••••"',(225,229,240)),('https://example.com/wp-json/wp/v2/posts',(150,169,255)),('',(225,229,240)),('HTTP/2 200',(128,232,179)),('{',(225,229,240)),('  "id": 742,',(225,229,240)),('  "status": "publish",',(128,232,179)),('  "auth": "application_password"',(128,232,179)),('}',(225,229,240))]
          yy=302
          for line,color in lines:
              d.text((875,yy),line,font=code,fill=color); yy+=48
          sx,sy=1235,700; shield=[(sx,sy-88),(sx+82,sy-52),(sx+66,sy+40),(sx,sy+100),(sx-66,sy+40),(sx-82,sy-52)]
          d.polygon(shield,fill=(88,75,241),outline=(190,184,255)); d.line((sx-35,sy,sx-8,sy+28,sx+44,sy-26),fill='white',width=15)
          for label,b in [('REST API',(75,902,295,968)),('APP PASSWORD',(330,902,640,968)),('HTTPS',(675,902,865,968))]:
              d.rounded_rectangle(b,radius=21,fill=(24,32,69),outline=(114,103,255),width=2); d.text((b[0]+22,b[1]+17),label,font=brand,fill=(238,240,248))
          out='/tmp/cover.webp'; img.save(out,'WEBP',quality=90,method=6)
          check=Image.open(out); check.load()
          assert check.format == 'WEBP' and check.size == (1536,1024)
          data=open(out,'rb').read(); print('generated',check.format,check.size,len(data),'sha256='+hashlib.sha256(data).hexdigest())
          PY
          test -s /tmp/cover.webp
          test "$(file -b --mime-type /tmp/cover.webp)" = 'image/webp'
          source_sha=$(sha256sum /tmp/cover.webp | awk '{print $1}')
          response=$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            --header 'Content-Type: image/webp' \
            --data-binary '@/tmp/cover.webp' \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}")
          echo "$response" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/public.webp
          test "$(file -b --mime-type /tmp/public.webp)" = 'image/webp'
          public_sha=$(sha256sum /tmp/public.webp | awk '{print $1}')
          test "$source_sha" = "$public_sha"
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/public.webp'); im.load(); assert im.format=='WEBP' and im.size==(1536,1024)
          print('public image verified:', im.format, im.size)
          PY
          echo "R2 cover verified: $PUBLIC_URL"
          echo "sha256=$public_sha"
