name: Temp check Store API cover in R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-check-store-api-cover.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact public R2 object
        shell: bash
        run: |
          set -euo pipefail
          url='https://img.likelyin.ru/2026/09/woocommerce-store-api-vs-rest-api.webp'
          expected='3d83c5e58ca237e1eefcfb2fe3e732fca58c96e8f8d8406c5c8f10cffecd23f5'
          curl -fsSL --retry 2 -o /tmp/cover.webp "$url"
          mime=$(file -b --mime-type /tmp/cover.webp)
          size=$(wc -c < /tmp/cover.webp | tr -d ' ')
          sha=$(sha256sum /tmp/cover.webp | awk '{print $1}')
          echo "R2 url=$url mime=$mime size=$size sha256=$sha"
          test "$mime" = 'image/webp'
          test "$size" -eq 120628
          test "$sha" = "$expected"
          echo 'R2 exact image OK'
