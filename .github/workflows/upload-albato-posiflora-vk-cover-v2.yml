name: Upload improved Albato Posiflora VK cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-albato-posiflora-vk-cover-v2.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
      OBJECT_KEY: 2026/08/albato-posiflora-vk-sinhronizaciya-tovarov.webp
      PUBLIC_URL: https://img.likelyin.ru/2026/08/albato-posiflora-vk-sinhronizaciya-tovarov.webp?v=20260831-0645
    steps:
      - name: Generate and upload cover
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import hashlib

          W,H=1536,1024
          img=Image.new('RGB',(W,H),(245,248,255))
          d=ImageDraw.Draw(img)

          # soft background
          d.ellipse((980,-160,1640,500), fill=(226,236,255))
          d.ellipse((-250,650,520,1320), fill=(235,242,255))
          d.rounded_rectangle((36,34,W-36,H-34), radius=34, outline=(220,227,241), width=2)

          fb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          fr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title=ImageFont.truetype(fb,58)
          subtitle=ImageFont.truetype(fr,27)
          badge=ImageFont.truetype(fb,24)
          card=ImageFont.truetype(fb,23)
          small=ImageFont.truetype(fr,18)
          smallb=ImageFont.truetype(fb,18)

          d.rounded_rectangle((74,66,300,120), radius=20, fill=(17,34,71))
          d.text((101,80),'A.S GROUPS',font=badge,fill='white')
          d.text((76,165),'Синхронизация каталога без лишних операций',font=title,fill=(17,28,58))
          d.text((78,244),'Posiflora → Apps Script → Google Sheets → Albato → VK',font=subtitle,fill=(70,87,123))
          d.text((78,286),'Apps Script делает тяжёлую работу. Albato получает только подготовленные изменения.',font=subtitle,fill=(70,87,123))

          d.rounded_rectangle((1060,75,1450,150), radius=24, fill=(255,244,226), outline=(244,177,70), width=2)
          d.text((1094,94),'↓ меньше операций Albato',font=badge,fill=(183,104,22))

          cards=[
            ('POSIFLORA','Товары, цены,\nостатки, фото',(76,410,320,610),(91,59,182)),
            ('APPS SCRIPT','Получение API\n+ фильтрация',(352,410,610,610),(32,124,218)),
            ('GOOGLE SHEETS','Состояние, ID\nи журнал',(642,410,912,610),(32,145,90)),
            ('ALBATO','Только webhook\nи отправка в VK',(944,410,1192,610),(232,120,54)),
            ('VK','Создание /\nобновление товара',(1224,410,1460,610),(53,112,224)),
          ]
          for label,desc,b,color in cards:
              x1,y1,x2,y2=b
              d.rounded_rectangle(b,radius=28,fill=(255,255,255),outline=color,width=4)
              d.rounded_rectangle((x1+20,y1+22,x2-20,y1+66),radius=16,fill=color)
              tb=d.textbbox((0,0),label,font=card); tw=tb[2]-tb[0]
              d.text(((x1+x2-tw)/2,y1+31),label,font=card,fill='white')
              for i,line in enumerate(desc.split('\n')):
                  bb=d.textbbox((0,0),line,font=small); tw=bb[2]-bb[0]
                  d.text(((x1+x2-tw)/2,y1+92+i*30),line,font=small,fill=(42,53,78))

          for x1,x2 in [(322,348),(612,638),(914,940),(1194,1220)]:
              y=510
              d.line((x1,y,x2,y),fill=(104,124,174),width=7)
              d.polygon([(x2,y),(x2-14,y-10),(x2-14,y+10)],fill=(104,124,174))

          # cost optimisation panel
          d.rounded_rectangle((78,690,1010,930),radius=30,fill=(255,255,255),outline=(211,220,239),width=2)
          d.text((112,722),'Как снизили расходы на Albato',font=card,fill=(17,28,58))
          items=[
            'Posiflora опрашивает Google Apps Script, а не Albato',
            'в таблицу пишутся уже нормализованные данные',
            'webhook вызывается только если товар реально изменился',
            'Albato не тратит операции на промежуточную обработку',
          ]
          for i,txt in enumerate(items):
              cy=780+i*36
              d.ellipse((116,cy+3,132,cy+19),fill=(45,155,95))
              d.line((120,cy+11,125,cy+16),fill='white',width=3)
              d.line((125,cy+16,131,cy+7),fill='white',width=3)
              d.text((148,cy),txt,font=small,fill=(48,61,90))

          d.rounded_rectangle((1052,690,1458,930),radius=30,fill=(20,38,78))
          d.text((1088,725),'Результат',font=card,fill='white')
          d.text((1088,776),'• меньше платных операций',font=smallb,fill=(220,231,255))
          d.text((1088,814),'• проще искать ошибки',font=smallb,fill=(220,231,255))
          d.text((1088,852),'• нет дублей товаров',font=smallb,fill=(220,231,255))
          d.text((1088,890),'• каталог VK обновляется автоматически',font=small,fill=(220,231,255))

          out='/tmp/cover.webp'
          img.save(out,'WEBP',quality=92,method=6)
          check=Image.open(out); check.load(); assert check.format=='WEBP' and check.size==(1536,1024)
          data=open(out,'rb').read(); print('generated',check.format,check.size,len(data),'sha256='+hashlib.sha256(data).hexdigest())
          PY

          test -s /tmp/cover.webp
          test "$(file -b --mime-type /tmp/cover.webp)" = 'image/webp'
          source_sha=$(sha256sum /tmp/cover.webp | awk '{print $1}')
          response=$(curl --fail-with-body --silent --show-error --request PUT \
            --header "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            --header 'Content-Type: image/webp' \
            --header 'X-ASG-Overwrite: true' \
            --data-binary '@/tmp/cover.webp' \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}")
          echo "$response" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/public.webp
          test "$(file -b --mime-type /tmp/public.webp)" = 'image/webp'
          public_sha=$(sha256sum /tmp/public.webp | awk '{print $1}')
          test "$source_sha" = "$public_sha"
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/public.webp'); im.load(); assert im.format=='WEBP' and im.size==(1536,1024)
          print('public image verified:', im.format, im.size)
          PY
          echo "R2 cover verified: $PUBLIC_URL"
          echo "sha256=$public_sha"
