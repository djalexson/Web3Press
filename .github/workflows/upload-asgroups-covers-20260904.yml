name: Upload A.S Groups article covers 2026-09-04 v3

on:
  push:
    paths:
      - '.github/workflows/upload-asgroups-covers-20260904.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      WOO_OBJECT: '2026/09/woocommerce-tormozit-prichiny-diagnostika-v3.webp'
      WP_OBJECT: '2026/09/stoimost-dorabotki-wordpress-2026-v3.webp'
      WOO_PUBLIC: 'https://img.likelyin.ru/2026/09/woocommerce-tormozit-prichiny-diagnostika-v3.webp'
      WP_PUBLIC: 'https://img.likelyin.ru/2026/09/stoimost-dorabotki-wordpress-2026-v3.webp'
    steps:
      - name: Install renderer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin webp fonts-dejavu-core

      - name: Build WooCommerce cover
        shell: bash
        run: |
          cat > /tmp/woo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111a31"/><stop offset="1" stop-color="#1d1235"/></linearGradient>
              <radialGradient id="glow" cx="78%" cy="28%" r="60%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".42"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
              <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".45"/></filter>
            </defs>
            <rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="1024" fill="url(#glow)"/>
            <circle cx="148" cy="160" r="88" fill="#8b5cf6" opacity=".1"/><circle cx="1320" cy="830" r="180" fill="#0ea5e9" opacity=".08"/>
            <g font-family="DejaVu Sans,Arial,sans-serif">
              <text x="110" y="190" font-size="48" font-weight="700" fill="#a78bfa">WooCommerce</text>
              <text x="110" y="292" font-size="86" font-weight="800" fill="#ffffff">тормозит?</text>
              <text x="110" y="356" font-size="31" font-weight="500" fill="#cbd5e1">Диагностика скорости интернет-магазина</text>
              <g transform="translate(110 430)">
                <rect width="246" height="68" rx="22" fill="#111827" stroke="#334155"/><circle cx="34" cy="34" r="8" fill="#fb7185"/><text x="58" y="43" font-size="22" fill="#e2e8f0">PHP / TTFB</text>
                <rect x="266" width="216" height="68" rx="22" fill="#111827" stroke="#334155"/><circle cx="300" cy="34" r="8" fill="#fbbf24"/><text x="324" y="43" font-size="22" fill="#e2e8f0">SQL</text>
                <rect x="502" width="216" height="68" rx="22" fill="#111827" stroke="#334155"/><circle cx="536" cy="34" r="8" fill="#38bdf8"/><text x="560" y="43" font-size="22" fill="#e2e8f0">API</text>
              </g>
              <text x="110" y="600" font-size="25" fill="#94a3b8">Сначала измеряем. Потом ускоряем.</text>
            </g>
            <g transform="translate(640 116)" filter="url(#shadow)" font-family="DejaVu Sans,Arial,sans-serif">
              <rect width="790" height="650" rx="34" fill="#0b1220" stroke="#334155" stroke-width="2"/>
              <rect x="24" y="24" width="742" height="602" rx="24" fill="url(#screen)"/>
              <rect x="24" y="24" width="742" height="58" rx="24" fill="#f8fafc"/>
              <circle cx="56" cy="53" r="7" fill="#fb7185"/><circle cx="80" cy="53" r="7" fill="#fbbf24"/><circle cx="104" cy="53" r="7" fill="#34d399"/>
              <rect x="48" y="108" width="170" height="492" rx="18" fill="#111827"/>
              <rect x="64" y="132" width="138" height="52" rx="14" fill="#7c3aed"/><text x="84" y="166" font-size="21" font-weight="700" fill="#fff">WooCommerce</text>
              <g font-size="18" fill="#cbd5e1"><text x="76" y="228">Dashboard</text><text x="76" y="272">Orders</text><text x="76" y="316">Products</text><text x="76" y="360">Analytics</text><text x="76" y="404">Marketing</text><text x="76" y="448">Settings</text></g>
              <text x="252" y="140" font-size="28" font-weight="700" fill="#0f172a">Performance overview</text>
              <g>
                <rect x="252" y="168" width="142" height="118" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="272" y="198" font-size="16" fill="#64748b">Page load</text><text x="272" y="248" font-size="38" font-weight="700" fill="#ef4444">4.8s</text>
                <rect x="410" y="168" width="142" height="118" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="430" y="198" font-size="16" fill="#64748b">TTFB</text><text x="430" y="248" font-size="38" font-weight="700" fill="#f59e0b">1.2s</text>
                <rect x="568" y="168" width="170" height="118" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="588" y="198" font-size="16" fill="#64748b">Queries</text><text x="588" y="248" font-size="38" font-weight="700" fill="#0f172a">87</text>
              </g>
              <rect x="252" y="310" width="486" height="152" rx="20" fill="#fff" stroke="#e2e8f0"/>
              <text x="274" y="344" font-size="18" font-weight="700" fill="#334155">Server response time</text>
              <path d="M278 421 L320 395 L360 405 L402 370 L445 382 L492 348 L538 360 L584 325 L630 344 L706 292" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="252" y="486" width="230" height="92" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="274" y="520" font-size="16" fill="#64748b">Object cache</text><text x="274" y="555" font-size="25" font-weight="700" fill="#16a34a">ACTIVE</text>
              <rect x="500" y="486" width="238" height="92" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="522" y="520" font-size="16" fill="#64748b">Slow queries</text><text x="522" y="555" font-size="25" font-weight="700" fill="#dc2626">FOUND</text>
            </g>
            <g transform="translate(705 785)" fill="#111827" stroke="#334155" stroke-width="2"><path d="M0 0h660l88 84H-62z"/><rect x="244" y="84" width="170" height="28" rx="14"/></g>
          </svg>
          SVG
          rsvg-convert -w 1536 -h 1024 /tmp/woo.svg -o /tmp/woo.png
          cwebp -quiet -q 90 /tmp/woo.png -o /tmp/woo.webp
          file /tmp/woo.webp

      - name: Build WordPress pricing cover
        shell: bash
        run: |
          cat > /tmp/wp.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
              <radialGradient id="glow" cx="18%" cy="16%" r="60%"><stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#64748b" flood-opacity=".26"/></filter>
            </defs>
            <rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="1024" fill="url(#glow)"/>
            <g font-family="DejaVu Sans,Arial,sans-serif">
              <text x="104" y="178" font-size="44" font-weight="700" fill="#2563eb">WordPress • 2026</text>
              <text x="104" y="268" font-size="74" font-weight="800" fill="#0f172a">Доработка сайта</text>
              <text x="104" y="340" font-size="36" font-weight="600" fill="#334155">цены на реальные задачи</text>
              <g transform="translate(104 414)">
                <rect width="208" height="62" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="32" y="40" font-size="20" font-weight="600" fill="#334155">Elementor</text>
                <rect x="226" width="252" height="62" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="256" y="40" font-size="20" font-weight="600" fill="#334155">WooCommerce</text>
                <rect x="496" width="144" height="62" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="543" y="40" font-size="20" font-weight="600" fill="#334155">API</text>
              </g>
              <text x="104" y="574" font-size="25" fill="#64748b">От локальной правки до сложной интеграции</text>
            </g>
            <g transform="translate(660 116)" filter="url(#shadow)" font-family="DejaVu Sans,Arial,sans-serif">
              <rect width="744" height="628" rx="34" fill="#111827"/>
              <rect x="22" y="22" width="700" height="584" rx="24" fill="#fff"/>
              <rect x="22" y="22" width="700" height="58" rx="24" fill="#f8fafc"/>
              <circle cx="54" cy="51" r="7" fill="#fb7185"/><circle cx="78" cy="51" r="7" fill="#fbbf24"/><circle cx="102" cy="51" r="7" fill="#34d399"/>
              <rect x="46" y="108" width="155" height="468" rx="18" fill="#111827"/>
              <circle cx="84" cy="150" r="22" fill="#2563eb"/><text x="75" y="159" font-size="26" font-weight="700" fill="#fff">W</text>
              <g font-size="17" fill="#cbd5e1"><text x="70" y="210">Dashboard</text><text x="70" y="252">Pages</text><text x="70" y="294">Plugins</text><text x="70" y="336">Appearance</text><text x="70" y="378">Users</text><text x="70" y="420">Settings</text></g>
              <text x="230" y="140" font-size="28" font-weight="700" fill="#0f172a">Оценка задач</text>
              <g>
                <rect x="230" y="170" width="444" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="252" y="202" font-size="17" fill="#334155">Правки Elementor / адаптив</text><text x="545" y="216" font-size="24" font-weight="700" fill="#2563eb">от 1 500 ₽</text>
                <rect x="230" y="258" width="444" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="252" y="290" font-size="17" fill="#334155">Исправление ошибки</text><text x="545" y="304" font-size="24" font-weight="700" fill="#2563eb">от 2 500 ₽</text>
                <rect x="230" y="346" width="444" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="252" y="378" font-size="17" fill="#334155">WooCommerce</text><text x="545" y="392" font-size="24" font-weight="700" fill="#2563eb">от 5 000 ₽</text>
                <rect x="230" y="434" width="444" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="252" y="466" font-size="17" fill="#334155">API / интеграция</text><text x="545" y="480" font-size="24" font-weight="700" fill="#2563eb">от 10 000 ₽</text>
              </g>
              <rect x="230" y="528" width="444" height="48" rx="14" fill="#dbeafe"/><text x="252" y="559" font-size="18" font-weight="700" fill="#1d4ed8">Оценка зависит от состояния проекта</text>
            </g>
            <g transform="translate(720 780)" fill="#334155"><path d="M0 0h606l84 76H-56z"/><rect x="214" y="76" width="180" height="24" rx="12"/></g>
          </svg>
          SVG
          rsvg-convert -w 1536 -h 1024 /tmp/wp.svg -o /tmp/wp.png
          cwebp -quiet -q 90 /tmp/wp.png -o /tmp/wp.webp
          file /tmp/wp.webp

      - name: Binary PUT both covers to R2 Worker
        shell: bash
        env:
          R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$R2_UPLOAD_API_TOKEN"
          upload_one() {
            local file="$1" object="$2" public="$3"
            local size sha response
            size="$(wc -c < "$file")"
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            response="$(curl --fail-with-body --silent --show-error \
              -X PUT \
              "https://upload.likelyin.ru/v1/upload/${object}" \
              -H "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
              -H 'Content-Type: image/webp' \
              -H 'X-ASG-Overwrite: true' \
              --data-binary "@${file}")"
            echo "$response"
            echo "$response" | jq -e --arg url "$public" --argjson size "$size" '.ok == true and .url == $url and .size == $size' >/dev/null
            echo "UPLOADED url=$public size=$size sha256=$sha"
          }
          upload_one /tmp/woo.webp "$WOO_OBJECT" "$WOO_PUBLIC"
          upload_one /tmp/wp.webp "$WP_OBJECT" "$WP_PUBLIC"

      - name: Verify public R2 objects byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          verify_one() {
            local src="$1" public="$2" dst="$3"
            curl --fail --silent --show-error "${public}?verify=${GITHUB_SHA}" -o "$dst"
            cmp "$src" "$dst"
            echo "VERIFIED url=$public size=$(wc -c < "$src") sha256=$(sha256sum "$src" | cut -d' ' -f1)"
          }
          verify_one /tmp/woo.webp "$WOO_PUBLIC" /tmp/woo-r2.webp
          verify_one /tmp/wp.webp "$WP_PUBLIC" /tmp/wp-r2.webp
