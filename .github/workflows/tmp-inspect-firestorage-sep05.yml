name: Inspect firestorage Sep05 sources

on:
  push:
    paths:
      - ".github/workflows/tmp-inspect-firestorage-sep05.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share JS
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          js='/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -L --silent --show-error "$base$js" -o app.js
          echo "JS_SIZE=$(wc -c < app.js)"
          grep -Eo '.{0,120}(fetch\(|/api/|download|share|publicId|fileId).{0,220}' app.js | head -120 || true
