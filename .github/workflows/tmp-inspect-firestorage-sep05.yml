name: Inspect firestorage Sep05 sources

on:
  push:
    paths:
      - ".github/workflows/tmp-inspect-firestorage-sep05.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public file API
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.firestorage.ai/dev/file/shares/KDXdRozgwrJj/files?maxResults=1000'
          curl -L --silent --show-error "$url" -o files.json
          jq -c . files.json
