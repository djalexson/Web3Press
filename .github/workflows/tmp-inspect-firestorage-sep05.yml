name: Inspect firestorage Sep05 sources

on:
  push:
    paths:
      - ".github/workflows/tmp-inspect-firestorage-sep05.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share page
        shell: bash
        run: |
          set -euo pipefail
          curl -L --silent --show-error 'https://firestorage.ai/ja/f/KDXdRozgwrJj' -o page.html
          echo "PAGE_MIME=$(file -b --mime-type page.html) SIZE=$(wc -c < page.html)"
          echo '--- scripts ---'
          grep -Eo '<script[^>]+src="[^"]+"' page.html | head -30 || true
          echo '--- endpoints/identifiers ---'
          grep -Eo '[/A-Za-z0-9_.?=&:-]*(api|share|file|download|public)[/A-Za-z0-9_.?=&:%-]*' page.html | head -80 || true
          echo '--- relevant lines ---'
          grep -niE 'download|api|public_id|file_id|share|fetch\(' page.html | head -80 || true
