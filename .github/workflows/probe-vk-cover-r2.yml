name: Probe VK bot cover in R2

on:
  push:
    paths:
      - '.github/workflows/probe-vk-cover-r2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      URL: 'https://img.likelyin.ru/2026/08/vk-bot-cvetochnyi-magazin-bez-vps.png'
      EXPECTED_SHA256: 'b17befb761cb50b040cbcbe05883660394c26cac4aeb1a122dd9cba59cc05a2d'
      EXPECTED_SIZE: '1963695'
    steps:
      - name: Probe exact object
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$URL?probe=${GITHUB_SHA}" -o /tmp/cover.png
          test "$(wc -c < /tmp/cover.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/cover.png" | sha256sum -c -
          test "$(file -b --mime-type /tmp/cover.png)" = 'image/png'
          echo "EXACT_R2_OBJECT_PRESENT=$URL"
