name: Upload exact Kwork cover to R2

on:
  push:
    paths:
      - '.github/workflows/upload-kwork-cover-exact.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://oaisdmntprpolandcentral.blob.core.windows.net/files/00000000-90b0-820a-b3fa-db2f72aa0c78/raw?se=2026-08-31T03%3A37%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=c3a0810a-26d7-41f3-b50e-c0cf2bd4f476&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A49%3A32Z&ske=2026-08-31T18%3A49%3A32Z&sks=b&skv=2026-02-06&sig=QVK/KYnlXZHVP1wWem9vFnAaEuxSC%2ByHh8W/rTBYs1g%3D'
      EXPECTED_SHA256: '49f36b536663dbff1171174e55cf8e25bac51dc51992a482517903813e5d4243'
      EXPECTED_SIZE: '2825669'
      OBJECT_KEY: '2026/08/kwork-ogranicheniya-cover.png'
      PUBLIC_URL: 'https://img.likelyin.ru/2026/08/kwork-ogranicheniya-cover.png'
    steps:
      - name: Download exact ChatGPT PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error "$SOURCE_URL" -o /tmp/kwork-cover.png
          test "$(wc -c < /tmp/kwork-cover.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/kwork-cover.png" | sha256sum -c -
          file /tmp/kwork-cover.png

      - name: Binary PUT to R2 upload Worker
        shell: bash
        env:
          R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X PUT \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}" \
            -H "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            -H 'Content-Type: image/png' \
            -H 'X-ASG-Overwrite: true' \
            --data-binary '@/tmp/kwork-cover.png')"
          echo "$response" | jq -e --arg url "$PUBLIC_URL" '.ok == true and .url == $url and .size == 2825669' >/dev/null
          echo "Uploaded: $PUBLIC_URL"

      - name: Verify public R2 object byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PUBLIC_URL?verify=${GITHUB_SHA}" -o /tmp/r2-cover.png
          test "$(wc -c < /tmp/r2-cover.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/r2-cover.png" | sha256sum -c -
          cmp /tmp/kwork-cover.png /tmp/r2-cover.png
          echo "VERIFIED_R2_URL=$PUBLIC_URL"
