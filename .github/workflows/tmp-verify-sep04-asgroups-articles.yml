name: Temporary verify Sep04 A.S Groups articles
on:
  push:
    paths:
      - '.github/workflows/tmp-verify-sep04-asgroups-articles.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop mobile SEO and sitemap
        run: |
          set -u
          slugs=(cloudflare-d1-free-limits-2026 telegram-bot-api-10-3-rich-messages)
          for slug in "${slugs[@]}"; do
            url="https://asgroups.dev/${slug}/"
            dc=$(curl -L -sS -o "/tmp/${slug}-desktop.html" -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/140 Safari/537.36' "$url")
            mc=$(curl -L -sS -o "/tmp/${slug}-mobile.html" -w '%{http_code}' -A 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' "$url")
            echo "$slug desktop_http=$dc mobile_http=$mc desktop_bytes=$(wc -c < /tmp/${slug}-desktop.html) mobile_bytes=$(wc -c < /tmp/${slug}-mobile.html)"
            grep -Fq "rel=\"canonical\" href=\"${url}\"" "/tmp/${slug}-desktop.html" && echo canonical=yes || echo canonical=no
            grep -q 'BlogPosting' "/tmp/${slug}-desktop.html" && echo BlogPosting=yes || echo BlogPosting=no
            grep -q 'FAQPage' "/tmp/${slug}-desktop.html" && echo FAQPage=yes || echo FAQPage=no
            grep -q 'wp-post-image\|featured' "/tmp/${slug}-desktop.html" && echo featured_marker=yes || echo featured_marker=no
            grep -q 'href="https://asgroups.dev/' "/tmp/${slug}-desktop.html" && echo internal_links=yes || echo internal_links=no
          done
          sc=$(curl -L -sS -o /tmp/sitemap.xml -w '%{http_code}' https://asgroups.dev/post-sitemap.xml)
          echo "sitemap_http=$sc"
          for slug in "${slugs[@]}"; do grep -q "https://asgroups.dev/${slug}/" /tmp/sitemap.xml && echo "sitemap_${slug}=yes" || echo "sitemap_${slug}=no"; done
