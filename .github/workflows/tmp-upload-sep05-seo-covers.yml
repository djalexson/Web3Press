name: Upload Sep 05 SEO covers to R2
on:
  push:
    paths:
      - '.github/workflows/tmp-upload-sep05-seo-covers.yml'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://d0abfd352b18b34de7b19d7afdece235.r2.cloudflarestorage.com
      R2_BUCKET: asgroups-images
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - name: Download free Unsplash source photos
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/wordpress-source.jpg 'https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&fm=jpg&q=88&w=2600'
          curl -L --fail --retry 3 -o /tmp/telegram-source.jpg 'https://images.unsplash.com/photo-1758876020967-e5a80e49463a?auto=format&fit=crop&fm=jpg&q=88&w=2600'
          test -s /tmp/wordpress-source.jpg
          test -s /tmp/telegram-source.jpg
      - name: Build 1536x1024 WebP covers
        run: |
          set -euo pipefail
          convert /tmp/wordpress-source.jpg -auto-orient -resize '1536x1024^' -gravity center -extent 1536x1024 -modulate 96,108,100 -contrast-stretch 0.5%x0.5% /tmp/wordpress-cover.png
          convert /tmp/telegram-source.jpg -auto-orient -resize '1536x1024^' -gravity center -extent 1536x1024 -modulate 96,108,100 -contrast-stretch 0.5%x0.5% /tmp/telegram-cover.png
          cwebp -quiet -q 92 /tmp/wordpress-cover.png -o /tmp/posle-obnovleniya-wordpress-slomalsya-sajt.webp
          cwebp -quiet -q 92 /tmp/telegram-cover.png -o /tmp/telegram-bot-dlya-biznesa-stoimost-2026.webp
          test "$(identify -format '%wx%h' /tmp/posle-obnovleniya-wordpress-slomalsya-sajt.webp)" = "1536x1024"
          test "$(identify -format '%wx%h' /tmp/telegram-bot-dlya-biznesa-stoimost-2026.webp)" = "1536x1024"
      - name: Upload and verify byte-for-byte
        run: |
          set -euo pipefail
          for name in posle-obnovleniya-wordpress-slomalsya-sajt telegram-bot-dlya-biznesa-stoimost-2026; do
            aws s3 cp "/tmp/${name}.webp" "s3://${R2_BUCKET}/2026/09/${name}.webp" --endpoint-url "$R2_ENDPOINT" --content-type image/webp --cache-control 'public,max-age=31536000,immutable'
            curl -fsS --retry 5 --retry-delay 2 -o "/tmp/r2-${name}.webp" "https://img.likelyin.ru/2026/09/${name}.webp"
            cmp "/tmp/${name}.webp" "/tmp/r2-${name}.webp"
            echo "${name} size=$(stat -c%s /tmp/${name}.webp)"
            sha256sum "/tmp/${name}.webp"
          done
