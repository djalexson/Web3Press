name: Temporary upload Kwork covers
on:
  push:
    paths:
      - '.github/kwork-covers-trigger.txt'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Render covers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          W,H=1536,1024
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          fs=ImageFont.truetype(bold,48); fm=ImageFont.truetype(reg,34)
          img=Image.new('RGB',(W,H),(20,26,38)); d=ImageDraw.Draw(img)
          d.rounded_rectangle((90,90,720,934),56,fill=(246,249,252)); d.rounded_rectangle((816,90,1446,934),56,fill=(232,248,239))
          for y in (250,390,530,670):
              d.rounded_rectangle((155,y,655,y+96),22,fill='white',outline=(214,220,229),width=2); d.ellipse((185,y+25,230,y+70),fill=(76,95,215)); d.rounded_rectangle((255,y+26,570,y+42),8,fill=(195,202,214)); d.rounded_rectangle((255,y+54,505,y+68),7,fill=(222,226,233))
          for y in (250,430,610):
              d.rounded_rectangle((875,y,1385,y+128),24,fill='white',outline=(191,221,199),width=2); d.rounded_rectangle((915,y+28,1280,y+47),8,fill=(99,163,117)); d.rounded_rectangle((915,y+65,1325,y+80),7,fill=(203,220,208))
              for x in range(915,1115,40): d.ellipse((x,y+96,x+18,y+114),fill=(66,142,88))
          d.text((135,120),'KWORK',font=fs,fill=(36,45,67)); d.text((865,120),'UPWORK',font=fs,fill=(39,112,60)); d.text((105,820),'КАТАЛОГ',font=fm,fill=(90,99,118)); d.text((880,820),'ОТКЛИКИ',font=fm,fill=(72,118,83)); d.text((W//2,955),'KWORK ИЛИ UPWORK 2026',font=fs,fill='white',anchor='ms')
          img.save('/tmp/kwork-ili-upwork-2026.webp','WEBP',quality=86,method=6)
          img=Image.new('RGB',(W,H),(244,242,236)); d=ImageDraw.Draw(img); d.rounded_rectangle((80,110,1456,900),58,fill='white',outline=(218,214,205),width=3)
          for r in (180,250,320): d.arc((300-r,230-r,300+r,230+r),210,510,fill=(85,114,190),width=5)
          for r in (170,245,320): d.arc((1230-r,720-r,1230+r,720+r),30,330,fill=(43,138,170),width=5)
          d.rounded_rectangle((430,235,1100,765),38,fill=(29,40,58)); d.text((475,280),'PROJECT BIDS',font=fs,fill='white')
          y=390
          for name,price in [('WordPress API','$220'),('WooCommerce','$480'),('Automation','$350')]:
              d.rounded_rectangle((475,y,1055,y+96),20,fill=(46,60,82)); d.text((510,y+22),name,font=fm,fill=(234,239,246)); d.text((1000,y+22),price,font=fm,fill=(104,214,187),anchor='ra'); y+=122
          d.text((120,160),'KWORK',font=fs,fill=(54,68,100)); d.text((1110,825),'FREELANCER',font=fs,fill=(31,108,144)); d.text((W//2,950),'KWORK ИЛИ FREELANCER.COM 2026',font=fs,fill=(31,40,54),anchor='ms')
          img.save('/tmp/kwork-ili-freelancer-2026.webp','WEBP',quality=86,method=6)
          PY
      - name: Upload and verify
        env:
          TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          for spec in 'kwork-ili-upwork-2026.webp:2026/09/kwork-ili-upwork-2026.webp' 'kwork-ili-freelancer-2026.webp:2026/09/kwork-ili-freelancer-2026.webp'; do
            f=${spec%%:*}; k=${spec#*:}; src=/tmp/$f
            curl --fail --silent --show-error -X PUT "https://upload.likelyin.ru/v1/upload/$k" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: image/webp' --data-binary "@$src"
            curl --fail --silent --show-error -L "https://img.likelyin.ru/$k?v=20260904-2000" -o "/tmp/verify-$f"
            s1=$(sha256sum "$src"|awk '{print $1}'); s2=$(sha256sum "/tmp/verify-$f"|awk '{print $1}'); test "$s1" = "$s2"
            echo "VERIFIED $k SHA256=$s1 SIZE=$(wc -c < "$src")"
          done
