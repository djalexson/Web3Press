name: Upload exact VK bot cover to R2

on:
  push:
    paths:
      - '.github/workflows/upload-vk-cover-exact.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-25d4-8210-991a-b9ff9adfc55f/raw?se=2026-08-31T04%3A55%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=20bb18c2-ed65-4f76-93a2-f2b942d3bfc0&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T03%3A11%3A15Z&ske=2026-09-01T03%3A11%3A15Z&sks=b&skv=2026-02-06&sig=T4t3hbMbYDniH37plIXL6ayWQGrv5ZvqsoZTO%2BBNCQQ%3D'
      EXPECTED_SHA256: 'b17befb761cb50b040cbcbe05883660394c26cac4aeb1a122dd9cba59cc05a2d'
      EXPECTED_SIZE: '1963695'
      OBJECT_KEY: '2026/08/vk-bot-cvetochnyi-magazin-bez-vps.png'
      PUBLIC_URL: 'https://img.likelyin.ru/2026/08/vk-bot-cvetochnyi-magazin-bez-vps.png'
    steps:
      - name: Download exact source PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error "$SOURCE_URL" -o /tmp/vk-cover.png
          test "$(wc -c < /tmp/vk-cover.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/vk-cover.png" | sha256sum -c -
          test "$(file -b --mime-type /tmp/vk-cover.png)" = 'image/png'

      - name: Binary PUT to R2 upload Worker
        shell: bash
        env:
          R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$R2_UPLOAD_API_TOKEN"
          response="$(curl --fail-with-body --silent --show-error \
            -X PUT \
            "https://upload.likelyin.ru/v1/upload/${OBJECT_KEY}" \
            -H "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            -H 'Content-Type: image/png' \
            -H 'X-ASG-Overwrite: true' \
            --data-binary '@/tmp/vk-cover.png')"
          echo "$response" | jq -e --arg url "$PUBLIC_URL" --argjson size "$EXPECTED_SIZE" '.ok == true and .url == $url and .size == $size' >/dev/null
          echo "Uploaded: $PUBLIC_URL"

      - name: Verify public R2 object byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PUBLIC_URL}?verify=${GITHUB_SHA}" -o /tmp/r2-cover.png
          test "$(wc -c < /tmp/r2-cover.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/r2-cover.png" | sha256sum -c -
          cmp /tmp/vk-cover.png /tmp/r2-cover.png
          echo "VERIFIED_R2_URL=$PUBLIC_URL"
