name: Upload Kwork alternatives cover to R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-kwork-next-cover-r2.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      R2_UPLOAD_API_TOKEN: ${{ secrets.R2_UPLOAD_API_TOKEN }}
      SOURCE_URL: 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXf-gNXujOhOZ7sjsEeBHT9mBvYL_87OHscL207Ly8O9cWn0igpdNKM2RLzSaMuoI2jH8ju2qrq8KBKq_w2LjjEr0ldYJ1nbdb9VznuRhNcIVd5LfsBv7kXhlwA5OhShW0HjAZE4t5NrwuBVlou-rSiuo89C8QPX2xyTOmnz2JV0BhGa=s2048?key=0HrFWm05AmxmECaZukjKQw'
      API_BASE: https://asgroups-r2-upload.i-0ab.workers.dev
      OBJECT_KEY: 2026/09/kwork-kuda-dalshe-2026-cover.png
      PUBLIC_URL: https://img.likelyin.ru/2026/09/kwork-kuda-dalshe-2026-cover.png
      EXPECTED_SHA256: c9fa8df3b2daa7c8336190e1d4f988425585388f93b62b335184eba32a4d9f0c
    steps:
      - uses: actions/checkout@v4
      - name: Download source image
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$SOURCE_URL" -o /tmp/source.png
          test "$(file -b --mime-type /tmp/source.png)" = 'image/png'
          source_sha=$(sha256sum /tmp/source.png | awk '{print $1}')
          test "$source_sha" = "$EXPECTED_SHA256"
          echo "Source verified: $source_sha"
      - name: Upload exact PNG to R2
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${R2_UPLOAD_API_TOKEN}" \
            --header 'Content-Type: image/png' \
            --header 'X-ASG-Overwrite: true' \
            --data-binary '@/tmp/source.png' \
            "${API_BASE}/v1/upload/${OBJECT_KEY}")
          echo "$response" | jq -e '.ok == true' >/dev/null
      - name: Verify public R2 object byte-for-byte
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/public.png
          test "$(file -b --mime-type /tmp/public.png)" = 'image/png'
          public_sha=$(sha256sum /tmp/public.png | awk '{print $1}')
          test "$public_sha" = "$EXPECTED_SHA256"
          echo "R2 cover verified: $PUBLIC_URL"
          echo "sha256=$public_sha"
