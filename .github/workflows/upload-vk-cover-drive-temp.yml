name: Cleanup temporary VK cover uploader

on:
  push:
    paths:
      - '.github/workflows/upload-vk-cover-drive-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary uploader and transport chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/upload-vk-cover-drive-temp.yml
          rm -rf .tmp/vk-cover
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary VK cover uploader artifacts'
          git push
